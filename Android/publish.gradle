apply plugin: 'maven-publish'
apply plugin: 'signing'

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath group: 'com.googlecode.json-simple', name: 'json-simple', version: '1.1'

    }
}
import org.json.simple.JSONArray

def baseVersion = findProperty("version")

def getAARPath(buildPath) {
    FileTree fileTree = project.fileTree(dir: buildPath, includes: ['**/*.aar'])
    if (fileTree.files) {
        return fileTree.files[0]
    } else {
        throw new GradleException("No aar found in the path $buildPath.")
    }
}

def isSnapshotVersion = { String version ->
    version != null && version.endsWith("-SNAPSHOT")
}

def getCentralTokenUsername = {
    findProperty("centralTokenUsername") ?: System.getenv("CENTRAL_TOKEN_USERNAME")
}

def getCentralTokenPassword = {
    findProperty("centralTokenPassword") ?: System.getenv("CENTRAL_TOKEN_PASSWORD")
}

afterEvaluate {
    def runTasks = gradle.startParameter.taskNames.toString().toLowerCase()
    // Only tasks whose names contain "publish" can be triggered to avoid other Gradle tasks from executing this section of logic.
    if (runTasks.contains("publish")) {
        publishing {
            publications {
                release(MavenPublication) {
                    groupId ARTIFACT_GROUP
                    artifactId ARTIFACT_NAME
                    version findProperty("version")
                    artifact(getAARPath("$project.buildDir/outputs/aar"))
                    pom {
                        name = artifactId
                        url = REPOSITORY_URL
                        description = DESCRIPTION
                        licenses {
                            license {
                                name = 'The Apache License, Version 2.0'
                                url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                            }
                        }
                        developers {
                            developer {
                                name = DEVELOPER_NAME
                                email = DEVELOPER_EMAIL
                            }
                        }
                        scm {
                            url = REPOSITORY_URL
                            connection = "scm:git:git://$REPOSITORY_SSH_URL"
                            developerConnection = "scm:git:ssh://$REPOSITORY_SSH_URL"
                        }
                        signing {
                            def signingKeyId = findProperty("signing.keyId")
                            def signingPassword = findProperty("signing.password")
                            def signingSecretKey = findProperty("signing.secretKey")
                            if (signingKeyId != null && signingKeyId != "") {
                                useInMemoryPgpKeys(signingKeyId, signingSecretKey, signingPassword)
                                sign publishing.publications.release
                            }
                        }
                    }
                }
            }
            repositories {
                maven {
                    if (isSnapshotVersion(baseVersion)) {
                        url = uri("https://central.sonatype.com/repository/maven-snapshots/")
                        credentials {
                            username = getCentralTokenUsername()
                            password = getCentralTokenPassword()
                        }
                    } else {
                        url = "$project.buildDir/release"
                    }
                }
            }
        }
    }
    tasks.withType(PublishToMavenRepository) { task ->
        task.doFirst {
            if (isSnapshotVersion(publication.version.toString())) {
                if (!repository.credentials.username || !repository.credentials.password) {
                    throw new GradleException("Snapshot publishing requires centralTokenUsername/centralTokenPassword or CENTRAL_TOKEN_USERNAME/CENTRAL_TOKEN_PASSWORD")
                }
                repository.url = uri("https://central.sonatype.com/repository/maven-snapshots/")
            } else {
                repository.url = "$project.buildDir/release/${publication.version}"
            }
        }
    }
}
