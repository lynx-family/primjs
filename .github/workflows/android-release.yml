name: android sdk release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag'
        required: false
        type: string

permissions:
  contents: write

jobs:
  get-version:
    runs-on: lynx-ubuntu-22.04-medium
    timeout-minutes: 60
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      release_mode: ${{ steps.get_version.outputs.RELEASE_MODE }}
    steps:
      - name: Get Version
        id: get_version
        run: |-
          if [ ${{ github.event_name }} == 'workflow_dispatch' ]; then
            version=${{ github.event.inputs.tag }}
            release_mode="manual"
          else
            version=$(echo ${{ github.ref }} | awk -F "/" '{print $3}')
            release_mode="tag_release"
          fi
          if [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || \
                $version =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ || \
                $version =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "Version is valid"
            echo "VERSION=$version" >> $GITHUB_OUTPUT;
            echo "RELEASE_MODE=$release_mode" >> $GITHUB_OUTPUT;
          else
            echo "Version is invalid"
            exit 1
          fi

  android-release:
    runs-on: lynx-ubuntu-22.04-medium
    needs: get-version
    steps:
    - name: Download Source
      uses: actions/checkout@v4.2.2

    - name: Set up JDK 11
      uses: actions/setup-java@v1
      with:
        java-version: 11

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.14.0'

    - name: Prepare weak-node-api headers
      run: |-
        if [ -d "$GITHUB_WORKSPACE/primjs/packages/weak-node-api" ]; then
          REPO_ROOT="$GITHUB_WORKSPACE/primjs"
        else
          REPO_ROOT="$GITHUB_WORKSPACE"
        fi
        cd "$REPO_ROOT/packages/weak-node-api"
        npm install
        npm run prepare:headers

    - name: Build artifact
      if: ${{ needs.get-version.outputs.release_mode == 'tag_release' }}
      run: |-
        pushd Android
        chmod +x ./gradlew
        ./gradlew assembleAllModulesRelease
        ./gradlew publishAllModules \
        -Pversion=${{ needs.get-version.outputs.version }} \
        -Psigning.keyId=${{ secrets.SIGNING_KEY_ID }} \
        -Psigning.password=${{ secrets.SIGNING_PASSWORD }} \
        -Psigning.secretKey=${{ secrets.SIGNING_SECRET_KEY }}
        ./gradlew zipArtifacts -Pversion=${{ needs.get-version.outputs.version }} getArtifactList
        popd
        pushd Android/build/
        artifact_list=$(<artifact-list)
        echo "artifact_list=$artifact_list" >> $GITHUB_OUTPUT;
        popd
      id: build_artifact

    - name: Build snapshot artifact
      if: ${{ needs.get-version.outputs.release_mode == 'manual' }}
      env:
        CENTRAL_TOKEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
        CENTRAL_TOKEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
      run: |-
        pushd Android
        chmod +x ./gradlew
        ./gradlew assembleAllModulesRelease
        ./gradlew publishAllModules -Pversion=${{ needs.get-version.outputs.version }}-SNAPSHOT \

    - name: Publish artifact to maven
      if: ${{ needs.get-version.outputs.release_mode == 'tag_release' }}
      uses: lynx-infra/maven-publish-action@2a55bab5273ffd84ebbb600e783286fc6251c239
      with:
        portal_api_token: ${{ secrets.PORTAL_API_TOKEN }}
        artifact_path_list: ${{ steps.build_artifact.outputs.artifact_list }}
