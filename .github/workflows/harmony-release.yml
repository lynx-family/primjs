name: harmony sdk release

on:
  # workflow_dispatch:
  #   inputs:
  #     tag:
  #       description: 'release tag'
  #       required: true
  #       type: string
  pull_request:
    branches:
      - develop
  
jobs:
  harmony-release:
    runs-on: lynx-custom-dind
    container: 
      image: ghcr.io/lynx-family/ubuntu24.04-harmony:lastest
      options: --cap-add=NET_ADMIN
      credentials:
        username: lynx-family
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set MTU
        run: |
          sudo apt install --no-install-recommends -y iproute2 
          sudo ip link set dev eth0 mtu 1450 # remain 50 for k8s overlay
          echo "MTU set successfully"
      - name: Install git-cliff
        run: |
          wget -q https://github.com/orhun/git-cliff/releases/download/v2.9.1/git-cliff_2.9.1_amd64.deb
          sudo dpkg -i git-cliff_2.9.1_amd64.deb
          git-cliff --version
      - name: Download Source
        uses: actions/checkout@v4.2.2
      - name: Get Tag Information
        run: |-
          version='0.0.1-alpha.6'
          echo "VERSION=$version" >> $GITHUB_OUTPUT;
        id: get_tag
      - name: Install deps
        shell: bash
        run: |
          source tools/envsetup.sh
          hab sync . -f --target harmony
      - name: Generate Change Log
        shell: bash
        run: |
          git-cliff --config harmony/primjs/cliff.toml \
          --latest | sed 's/<!-- version -->/${{ steps.get_tag.outputs.VERSION }}/g' > harmony/primjs/CHANGELOG.md
      - name: Build & Publish
        shell: bash
        run: |
          export PUBLISH_KEY_PASSPHRASE=${{ secrets.HARMONY_PUBLISH_KEY_PASSPHRASE }}
          echo ${{ secrets.HARMONY_PUBLISH_KEY }} > ${{ github.workspace }}/publish_key
          ohpm config set publish_registry https://ohpm.openharmony.cn/ohpm
          pushd harmony
          ./scripts/build.py --modules primjs --build_type Release --build_napi_adapter --version ${{ steps.get_tag.outputs.VERSION }}
          pushd primjs/build/default/outputs/default
          ohpm publish primjs.har --publish_id ${{ secrets.HARMONY_PUBLISH_ID }} --key_path ${{ github.workspace }}/publish_key
          popd
          popd
      # - name: Push to release
      #   uses: ncipollo/release-action@v1
      #   with:
      #     tag: ${{ steps.get_tag.outputs.VERSION }}
      #     token: ${{ secrets.GITHUB_TOKEN }}
      #     replacesArtifacts: true
      #     allowUpdates: true
      #     artifacts: "harmony/primjs/build/default/outputs/default/primjs.har"
