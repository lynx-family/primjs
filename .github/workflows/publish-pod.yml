name: Publish Pod

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'version of pod'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-pod-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  get-version:
    runs-on: lynx-ubuntu-22.04-medium
    timeout-minutes: 60
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Get Version
        id: get_version
        run: |-
          if [ ${{ github.event_name }} == 'workflow_dispatch' ]; then
            version=${{ github.event.inputs.version }}
          else
            version=$(echo ${{ github.ref }} | awk -F "/" '{print $3}')
          fi
          if [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || \
                $version =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ || \
                $version =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]; then
            echo "Version is valid"
            echo "VERSION=$version" >> $GITHUB_OUTPUT;
          else
            echo "Version is invalid"
            exit 1
          fi

  publish-pod:
    runs-on: macos-14
    needs: get-version
    steps:
      - name: Download Source
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Ruby + specify Bundler version
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.6.10'
      - name: Cache Ruby gem packages
        uses: actions/cache@v4
        with:
          path: .bundle/ruby/*/cache
          key: ${{ runner.os }}-${{ runner.arch }}-gems-v1-${{ hashFiles('Gemfile', 'Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gems-v1-
      - name: Bundle Install
        run: |-
          SDKROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk bundle install --path .bundle
      - name: Create Specs repo GitHub App token
        id: specs_app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.SPECS_REPO_APP_ID }}
          private-key: ${{ secrets.SPECS_REPO_APP_PRIVATE_KEY }}
          owner: lynx-family
          repositories: Specs
          permission-contents: write
      - name: Download Specs Repo
        uses: actions/checkout@v4.2.2
        with:
          repository: lynx-family/Specs
          token: ${{ steps.specs_app_token.outputs.token }}
          path: .specs
          fetch-depth: 0
      - name: Publish to Lynx Specs Repo
        env:
          POD_VERSION: ${{ needs.get-version.outputs.version }}
          PRIMJS_COMMIT_ID: ${{ github.sha }}
        run: |-
          set -euo pipefail

          bundle exec pod ipc spec PrimJS.podspec > PrimJS.podspec.json

          bundle exec pod spec lint PrimJS.podspec.json \
            --sources=https://github.com/lynx-family/Specs.git,https://cdn.cocoapods.org/ \
            --skip-import-validation \
            --allow-warnings

          spec_path="PrimJS/$POD_VERSION/PrimJS.podspec.json"
          target_path=".specs/$spec_path"
          if [ -e "$target_path" ]; then
            if cmp --silent PrimJS.podspec.json "$target_path"; then
              echo "PrimJS $POD_VERSION is already published with identical content."
              exit 0
            fi
            echo "PrimJS $POD_VERSION already exists with different content."
            exit 1
          fi

          mkdir -p "$(dirname "$target_path")"
          cp PrimJS.podspec.json "$target_path"

          git -C .specs config user.name "lynx.authors"
          git -C .specs config user.email "lynx.authors@users.noreply.github.com"
          git -C .specs add "$spec_path"
          git -C .specs commit -m "[Update] PrimJS ($POD_VERSION)"

          for attempt in 1 2 3; do
            git -C .specs fetch origin master

            if git -C .specs cat-file -e "origin/master:$spec_path" 2>/dev/null; then
              git -C .specs show "origin/master:$spec_path" > remote-podspec.json
              if cmp --silent PrimJS.podspec.json remote-podspec.json; then
                echo "PrimJS $POD_VERSION was published concurrently with identical content."
                exit 0
              fi
              echo "PrimJS $POD_VERSION was published concurrently with different content."
              exit 1
            fi

            git -C .specs rebase origin/master
            if git -C .specs push origin HEAD:master; then
              exit 0
            fi

            echo "Push attempt $attempt failed; retrying."
          done

          echo "Failed to publish PrimJS $POD_VERSION after 3 attempts."
          exit 1