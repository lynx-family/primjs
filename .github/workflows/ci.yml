name: ci

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  coding-style:
    runs-on: lynx-ubuntu-22.04-medium
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"
      - name: Cache formatter dependency
        uses: lynx-infra/cache@d6bd70bf2182b228ff5cfa9539e5f61b0929a1ba
        with:
          path: |
            ~/.habitat_cache/habitat
            ~/.habitat_cache/objects
          key: ${{ runner.os }}-${{ runner.arch }}-formatter-v1-${{ hashFiles('.habitat', 'DEPS', 'tools/ci/DEPS.precheck', 'tools/hab') }}
      - name: Install pinned formatter
        run: bash tools/hab sync . --target precheck --target-only
      - name: Check all tracked source files
        shell: bash
        run: |
          buildtools/llvm/bin/clang-format --version | grep -F '020d2fb7711d70e296f19d83565f8d93d2cfda71'
          git ls-files -z -- '*.java' '*.h' '*.hpp' '*.c' '*.cc' '*.cpp' '*.m' '*.mm' ':(exclude)*_jni.h' |
            xargs -0 buildtools/llvm/bin/clang-format --dry-run --Werror --
  commit-check:
    runs-on: lynx-ubuntu-22.04-medium
    steps:
      - name: Download source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"
      - name: Check single PR commit
        if: github.event_name == 'pull_request'
        env:
          COMMIT_COUNT: ${{ github.event.pull_request.commits }}
        run: test "$COMMIT_COUNT" -eq 1
      - name: Run commit-message check
        run: python3 -B tools/cli/commit_message_helper.py
  lint-pod:
    runs-on: lynx-darwin-14-medium
    steps:
      - name: Download Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install libyaml
        run: brew install libyaml
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: '2.6'
      - name: Cache Ruby gem packages
        uses: lynx-infra/cache@1f4c655e363ee8910dce6ee0fe9ab3289d676add # main
        with:
          path: .bundle/ruby/*/cache
          key: ${{ runner.os }}-${{ runner.arch }}-gems-v1-${{ hashFiles('Gemfile', 'Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gems-v1-
      - name: Bundle Install
        run: |-
          SDKROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk bundle install --path .bundle
      - name: Lint
        env:
          POD_VERSION: 0.0.1-for-ci-test
          PRIMJS_GIT_URL: ${{ github.event.pull_request.head.repo.clone_url || github.event.repository.clone_url }}
          PRIMJS_COMMIT_ID: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |-
          bundle exec pod spec lint PrimJS.podspec --verbose --skip-import-validation --allow-warnings
  
  check-unittests-linux:
    runs-on: lynx-ubuntu-22.04-medium
    steps:
      - name: Download Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python 3.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"
      - name: Cache Habitat dependencies
        uses: lynx-infra/cache@1f4c655e363ee8910dce6ee0fe9ab3289d676add # main
        with:
          path: |
            ~/.habitat_cache/habitat
            ~/.habitat_cache/git
            ~/.habitat_cache/objects
          key: ${{ runner.os }}-${{ runner.arch }}-habitat-v1-${{ hashFiles('.habitat', 'DEPS', 'tools/hab') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-habitat-v1-
      - name: Install deps
        run: |
          source tools/envsetup.sh
          hab sync . -f
      - name: Build unittests
        run: |
          source tools/envsetup.sh
          python3 tools/ci/check_test_build.py
      - name: Run unittests
        run: 
          python3 tools/ci/check_test_run.py

  check-unittests-darwin:
    runs-on: lynx-darwin-14-medium
    steps:
      - name: Download Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Cache Habitat dependencies
        uses: lynx-infra/cache@1f4c655e363ee8910dce6ee0fe9ab3289d676add # main
        with:
          path: |
            ~/.habitat_cache/habitat
            ~/.habitat_cache/git
            ~/.habitat_cache/objects
          key: ${{ runner.os }}-${{ runner.arch }}-habitat-v1-${{ hashFiles('.habitat', 'DEPS', 'tools/hab') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-habitat-v1-
      - name: Install deps
        run: |
          source tools/envsetup.sh
          hab sync . -f
      - name: Build unittests
        run: |
          source tools/envsetup.sh
          python3 tools/ci/check_test_build.py
      - name: Run unittests
        run: 
          python3 tools/ci/check_test_run.py
      - name: Run wasm tests
        run: |
          source tools/envsetup.sh
          bash testing/wasm/wasm_run.sh
