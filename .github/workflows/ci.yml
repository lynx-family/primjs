name: ci

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  coding-style:
    runs-on: lynx-ubuntu-22.04-medium
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "to be done"
  lint-pod:
    runs-on: lynx-darwin-14-medium
    steps:
      - name: Download Source
        uses: actions/checkout@v4.2.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Rebase onto upstream
        run: |
          git config --global user.name "lynx.authors"
          git config --global user.email "lynx.authors@users.noreply.github.com"
          git remote add upstream https://github.com/${{ github.repository }}.git
          git fetch upstream ${{ github.base_ref }} 
          git rebase upstream/${{ github.base_ref }}
      - name: Install libyaml
        run: brew install libyaml
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.6'
      - name: Bundle Install
        run: |-
          SDKROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk bundle install --path .bundle
      - name: Lint
        run: |-
          POD_VERSION=${{ github.event.pull_request.head.sha }} bundle exec pod spec lint PrimJS.podspec --verbose --skip-import-validation --allow-warnings
  
  check-unittests-linux:
    runs-on: lynx-ubuntu-22.04-medium
    steps:
      - name: Download Source
        uses: actions/checkout@v4.2.2
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install deps
        run: |
          source tools/envsetup.sh
          hab sync . -f
      - name: Build unittests
        run: |
          source tools/envsetup.sh
          python3 tools/ci/check_test_build.py
      - name: Run unittests
        run: 
          python3 tools/ci/check_test_run.py

  check-unittests-darwin:
    runs-on: lynx-darwin-14-medium
    steps:
      - name: Download Source
        uses: actions/checkout@v4.2.2
      - name: Install deps
        run: |
          source tools/envsetup.sh
          hab sync . -f
      - name: Build unittests
        run: |
          source tools/envsetup.sh
          python3 tools/ci/check_test_build.py
      - name: Run unittests
        run: 
          python3 tools/ci/check_test_run.py
