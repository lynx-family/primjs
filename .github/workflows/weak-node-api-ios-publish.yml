name: weak_node_api_ios_publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'iOS pod version'
        required: true
        type: string

jobs:
  weak-node-api-ios-publish:
    runs-on: macOS-latest
    permissions:
      contents: write
    steps:
      - name: Download Source
        uses: actions/checkout@v4.2.2
        with:
          path: primjs

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Ruby + specify Bundler version
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.6.10'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Bundle Install
        run: |-
          cd $GITHUB_WORKSPACE/primjs
          SDKROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk bundle install --path .bundle

      - name: Install dependencies and prepare headers
        run: |
          cd $GITHUB_WORKSPACE/primjs/packages/weak-node-api
          npm install
          npm run prepare:headers

      - name: Prepare iOS pod source
        run: |-
          cd $GITHUB_WORKSPACE/primjs
          python3 tools/ios_tools/cocoapods_publish_helper.py \
            --prepare-source \
            --version ${{ github.event.inputs.version }} \
            --tag weak-node-api-v${{ github.event.inputs.version }} \
            --release-repo ${{ github.repository }}

      - name: Upload iOS source zip to release
        uses: ncipollo/release-action@v1
        with:
          tag: weak-node-api-v${{ github.event.inputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: '${{ github.workspace }}/primjs/packages/weak-node-api/dist/ios/LynxWeakNodeAPI-${{ github.event.inputs.version }}.zip'
          replacesArtifacts: true
          allowUpdates: true
          body: ''

      - name: Publish to CocoaPods Repo
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.REPO_PRIMJS_COCOAPODS_TRUNK_TOKEN }}
        run: |-
          cd $GITHUB_WORKSPACE/primjs
          git config --global user.name "lynx.authors"
          git config --global user.email "lynx.authors@users.noreply.github.com"
          python3 tools/ios_tools/cocoapods_publish_helper.py --publish
